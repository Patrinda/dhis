    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 60
    environment:
      <<: *env
      SERVICE: patient
      DB_ENGINE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DHIS_BACKGROUND: 1
      DJANGO_DEBUG: 0
      DB_NAME: db_pat_a
      NODE_CODE: KRH
      PATIENT_URL: http://patient-krh:8000
    healthcheck:

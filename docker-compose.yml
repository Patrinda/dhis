      retries: 20
      start_period: 10s
    depends_on:
      keys: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      identity: {condition: service_healthy}

  records-bdh:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:9002 --workers 1 --threads 8 --timeout 60
    environment:
